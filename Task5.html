<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #74ebd5, #acb6e5);
      margin: 0;
      padding: 20px;
      text-align: center;
      color: #333;
    }

    .weather-container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    input {
      padding: 10px;
      width: 200px;
      font-size: 16px;
      margin-right: 10px;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      background-color: #0072ff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #005bb5;
    }

    .weather-info {
      margin-top: 20px;
    }

    .weather-info img {
      width: 80px;
    }
  </style>
</head>
<body>

  <div class="weather-container">
    <h1>Weather App</h1>
    <input type="text" id="cityInput" placeholder="Enter city name" />
    <button onclick="getWeatherByCity()">Search</button>
    <button onclick="getWeatherByLocation()">📍 My Location</button>

    <div class="weather-info" id="weatherInfo"></div>
  </div>

  <script>
    const API_KEY = 'https://api.openweathermap.org/data/3.0/onecall?lat={lat}&lon={lon}&exclude={part}&appid={API key}'; // Replace with your OpenWeatherMap API key

    function displayWeather(data) {
      const weatherDiv = document.getElementById('weatherInfo');
      if (data.cod !== 200) {
        weatherDiv.innerHTML = `<p>${data.message}</p>`;
        return;
      }
      const { name, main, weather } = data;
      const icon = `https://openweathermap.org/img/wn/${weather[0].icon}@2x.png`;
      weatherDiv.innerHTML = `
        <h2>${name}</h2>
        <img src="${icon}" alt="${weather[0].description}" />
        <p><strong>${main.temp}°C</strong></p>
        <p>${weather[0].description}</p>
      `;
    }

    function getWeatherByCity() {
      const city = document.getElementById('cityInput').value;
      fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`)
        .then(response => response.json())
        .then(data => displayWeather(data))
        .catch(err => console.error(err));
    }

    function getWeatherByLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const { latitude, longitude } = position.coords;
          fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${latitude}&lon=${longitude}&appid=${API_KEY}&units=metric`)
            .then(response => response.json())
            .then(data => displayWeather(data))
            .catch(err => console.error(err));
        }, () => {
          alert('Unable to access your location.');
        });
      } else {
        alert('Geolocation not supported by this browser.');
      }
    }
  </script>
</body>
</html>
